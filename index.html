<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Amat Bajualan - Tes Printer</title><style>
body{font-family:Arial;margin:0;background:#f5f5f5}.wrap{max-width:520px;margin:auto;padding:20px}.card{background:#fff;padding:22px;border-radius:20px;box-shadow:0 5px 20px #0001}h1{margin:0}.sub{color:#666}button{width:100%;padding:15px;margin:8px 0;border:0;border-radius:13px;font-weight:bold;font-size:16px}#scan{background:#f97316;color:white}#connect{background:#222;color:white}#test{background:#16a34a;color:white}.status{padding:14px;border-radius:12px;background:#eee}.ok{background:#dcfce7;color:#166534}.warn{background:#fff7ed;color:#9a3412}.box{margin-top:14px;padding:14px;border:1px solid #ddd;border-radius:12px}.label{font-size:12px;color:#777}.value{font-weight:bold;margin-top:4px;word-break:break-all}.log{font-size:12px;white-space:pre-wrap;max-height:260px;overflow:auto}</style></head><body><div class="wrap"><div class="card">
<h1>🖨️ Tes Bluetooth Printer</h1><p class="sub">Amat Bajualan • MP-58X1</p><div id="status" class="status">⚪ Belum mencari printer.</div>
<button id="scan">🔍 Cari Printer Bluetooth</button><button id="connect" disabled>🔗 Hubungkan Printer</button><button id="test" disabled>🧾 Cetak Tes</button>
<div class="box"><div class="label">Nama perangkat</div><div id="name" class="value">Belum ada</div></div><div class="box"><div class="label">ID perangkat</div><div id="id" class="value">Belum ada</div></div><div class="box"><div class="label">Log</div><div id="log" class="log">Belum ada aktivitas.</div></div>
</div></div><script>
let d=null,s=null,w=null;const $=x=>document.getElementById(x);function log(x){$("log").textContent+="\n"+x}function st(x,c=""){$("status").className="status "+c;$("status").textContent=x}
const sv=["000018f0-0000-1000-8000-00805f9b34fb","0000ffe0-0000-1000-8000-00805f9b34fb","49535343-fe7d-4ae5-8fa9-9fafd205e455","0000ff00-0000-1000-8000-00805f9b34fb","0000ae30-0000-1000-8000-00805f9b34fb"];
$("scan").onclick=async()=>{try{st("🔍 Memilih perangkat...","warn");d=await navigator.bluetooth.requestDevice({acceptAllDevices:true,optionalServices:sv});$("name").textContent=d.name||"(tanpa nama)";$("id").textContent=d.id;$("connect").disabled=false;st("✅ Perangkat ditemukan.","ok");log("Dipilih: "+(d.name||"tanpa nama"))}catch(e){st("❌ Pemilihan dibatalkan/gagal.","warn");log(e.message)}};
$("connect").onclick=async()=>{try{st("🔗 Menghubungkan...","warn");s=await d.gatt.connect();st("🟢 TERHUBUNG via Web Bluetooth!","ok");log("GATT berhasil.");w=null;
for(const u of sv)try{const x=await s.getPrimaryService(u);log("SERVICE: "+x.uuid);for(const c of await x.getCharacteristics()){log("CHAR: "+c.uuid+" "+JSON.stringify(c.properties));if(!w&&(c.properties.write||c.properties.writeWithoutResponse))w=c}}catch(e){}
if(w){$("test").disabled=false;log("✅ WRITE ditemukan: "+w.uuid)}else log("⚠️ WRITE belum ditemukan.")}catch(e){st("❌ Gagal terhubung.","warn");log(e.message)}};
$("test").onclick=async()=>{try{const b=new TextEncoder().encode("\x1b\x40AMAT BAJUALAN\nTES BLUETOOTH\n------------------------------\nBERHASIL TERHUBUNG\n\n\n");if(w.properties.writeWithoutResponse)await w.writeValueWithoutResponse(b);else await w.writeValue(b);st("🧾 PERINTAH CETAK TERKIRIM!","ok");log("ESC/POS terkirim.")}catch(e){st("❌ Gagal mengirim.","warn");log(e.message)}};
</script></body></html>
